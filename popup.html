<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Synopsis Generator</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="window-frame">
    <!-- Header wrapper holding tabs, chevrons, and workstation text box in a straight row -->
    <div class="nav-bar-wrapper">
        <div class="tab-container" id="tabContainer"></div>
        <button id="navLeftBtn" class="nav-arrow-btn">&lt;</button>
        <button id="navRightBtn" class="nav-arrow-btn">&gt;</button>
        <button id="toolbarSettingsBtn" class="nav-arrow-btn" title="Open Field Configuration Editor" aria-label="Settings">&#x2699;</button>
        <input aria-label="workstation" type="text" id="workstation" placeholder="8012" maxlength="4" class="workstation-input">
    </div>

    <!-- Outer 2-column form elements layout area -->
    <div class="form-container">
        <div id="formMountPoint"></div>
    </div>

    <!-- Output panel and copy action components -->
    <div class="output-container">
        <h3>Synopsis</h3>
        <div class="statement-box" id="statementOutput">---</div>
        <button id="copyBtn">Copy Synopsis</button>
    </div>
</div>

<script type="module" src="popup.js"></script>
</body>
</html>
